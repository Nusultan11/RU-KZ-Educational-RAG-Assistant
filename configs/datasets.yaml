datasets:
  retrieval:
    kazakh:
      name: "shyngys879/Kazakh-Wiki-RAG-Dataset"
      role: "kazakh_retrieval_corpus"
      load_configurations:
        - name: pairs
          builder: csv
          data_files:
            train: train.csv
            validation: dev.csv
            test: test.csv
        - name: triplets
          builder: csv
          data_files:
            train: train_triplets.csv

    russian:
      name: "kaengreg/sberquad-retrieval"
      role: "russian_retrieval_dataset"

  instruction:
    kazakh:
      name: "AmanMussa/kazakh-instruction-v2"
      role: "kazakh_sft_instruction_data"

    russian:
      name: "Den4ikAI/russian_instructions_2"
      role: "russian_sft_instruction_data"

